name: TascaSonora
options:
  bundleIdPrefix: com.example            # cambia con un prefisso tuo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  TascaSonora:
    type: application
    platform: iOS
    sources:
      - path: TascaSonora
      - path: Firmware/tasca_sonora.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tascasonora   # cambia con un identificativo tuo
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                  # inserisci il tuo Team ID Apple
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TascaSonora/Info.plist
      properties:
        CFBundleDisplayName: "Tasca Sonora"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "Serve per collegarsi al portachiavi Tasca Sonora e scambiare i suoni."
        NSMicrophoneUsageDescription: "Serve per registrare con il telefono un suono da mandare al portachiavi."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
